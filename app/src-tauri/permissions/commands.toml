[[permission]]
identifier = "allow-aipet-commands"
description = "Allow AIPet custom IPC commands for settings and pet data."
commands.allow = [
  "get_platform",
  "show_pet_menu",
  "clamp_main_window_to_screen",
  "reset_main_window_position",
  "get_app_config",
  "save_app_config",
  "get_state_config",
  "save_state_config",
  "list_pets",
  "get_pet_detail",
  "get_pet_spritesheet_path",
  "refresh_pets_dir",
  "get_app_data_path",
  "open_app_data_dir",
  "list_running_processes",
  "get_ai_api_config",
  "save_ai_api_config",
  "start_pet_creation",
  "list_incomplete_tasks",
  "resume_pet_creation",
  "cancel_pet_creation",
  "confirm_base_image",
  "get_remote_server_config",
  "save_remote_server_config",
  "get_remote_server_status",
  "start_remote_pet_creation",
  "cancel_remote_pet_creation",
  "confirm_remote_base_image",
  "import_pet_zip_file",
  "delete_pet",
]
